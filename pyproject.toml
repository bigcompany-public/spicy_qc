[project]
name = "spicy-qc"
version = "0.1.0"
description = "Quality Control system with clear visual feedback, designed to help teams quickly identify, understand, and resolve issues during production"
readme = "README.md"
authors = [
    { name = "Tristan Languebien", email = "tlanguebien@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "PySide6",
    "QtAwesome",
    "Markdown",
    "emoji"
]

[project.optional-dependencies]
docs = [
    "zensical",
    "mkdocstrings-python"
]

[project.scripts]
spicy-qc-example = "spicy_qc.main:example"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
