[project]
site_name = "SpicyQC"
site_description = "Quality Control system with clear visual feedback, designed to help teams quickly identify, understand, and resolve issues during production"
site_url = "https://bigcompany-public.github.io/spicy_qc/"
repo_url = "https://github.com/bigcompany-public/spicy_qc/"
repo_name = "bigcompany-public/spicy_qc"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/extra.css"]
nav = [
    { "Home" = "index.md" },
    { "QuickStart" = "quickstart.md" },
    { "User Documentation" = "user_documentation.md" },
    { "TD/Dev Documentation" = "dev_documentation.md" },
    { "Markdown Reference" = "markdown.md" },
    { "Python Reference" = "python_reference.md" },
]

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "blue"
toggle.icon = "lucide/moon-star"
toggle.name = ""

[project.theme]
features = [
    "navigation.sections",
    "navigation.top",
    "search.suggest",
    "search.highlight",
    "content.tabs.link",
    "content.code.annotation",
    "content.code.copy",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_source = false
docstring_section_style = "list"
# extensions = []
group_by_category = true
heading_level = 2
members_order = "alphabetical"
merge_init_into_class = false
modernize_annotations = true
parameter_headings = false
separate_signature = true
show_category_heading = true
show_docstring_attributes = false
show_docstring_parameters = true
show_docstring_returns = true
show_if_no_docstring = true
show_labels = false
show_root_full_path = false
show_root_heading = true
show_root_toc_entry = false
show_signature_annotations = true
show_signature = true
show_symbol_type_heading = true
show_symbol_type_toc = true
signature_crossrefs = true
relative_crossrefs = true
scoped_crossrefs = true
filters = ["!^_"]

